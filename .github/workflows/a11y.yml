name: Accessibility audit

# Builds the static export and runs axe-core (WCAG 2.0, 2.1 and 2.2 A and AA plus best practice) in headless Chrome
# over the DevTools protocol (scripts/a11y.ts): every sampled page in the light theme, and one page of each type in
# the dark-device default and the high-contrast theme too. This is the half that needs a browser (colour contrast,
# target size, the dark default actually painting dark). The markup rules run in the ship gates
# (src/app/a11y.test.ts). Serious and critical violations not on the allowance list in
# src/test-utils/a11y-allowance.ts fail the job; the full report is uploaded.
on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub's Ubuntu image ships Google Chrome; axe-core is a devDependency, so nothing else is installed.
      - name: Run the audit
        run: CHROME="$(command -v google-chrome || command -v google-chrome-stable)" npx tsx scripts/a11y.ts --report a11y-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-report
          path: a11y-report.json
          retention-days: 30
