name: Refresh universe denominators

on:
  schedule:
    - cron: "37 6 * * 3" # Wednesdays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch:universe
      # Startup monitors (added 3 November 2026): portfolio pages, SEC S-1/F-1 filings, HKEX 18A, FDA and EMA orphan
      # designations and NCI SBIR/STTR awards, each written to a review queue under .cache/ (ignored by git, so nothing
      # reaches the pull request below). Their "not yet in OnCo" findings join the standing issue in the next step.
      # A failure here never stops the refresh: the issue simply carries no monitor section that week.
      - name: Startup monitors (review queue only)
        continue-on-error: true
        timeout-minutes: 15
        run: npx tsx scripts/startup-monitors.ts --days=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-monitors
          path: .cache/startup-monitors/
          retention-days: 30
          if-no-files-found: ignore
      # One standing issue lists what the refresh found that someone must act on: sources whose snapshot is going stale
      # because the fetch failed (fetch-universe keeps the old copy and only logs it), portfolio companies OnCo lacks,
      # and (since 3 November 2026) what the startup monitors above found that no company record matches.
      # Added 1 November 2026, after Even One's page changed shape and two weeks of failed reads went unnoticed.
      - name: Report what needs a person
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/universe-gaps.ts > gaps.md
          title="Freshness: stale sources and companies to add"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -s gaps.md ]; then
            gh label create freshness --color 0E8A16 --description "Found by a weekly refresh" --force || true
            if [ -n "$n" ]; then gh issue edit "$n" --body-file gaps.md; else gh issue create --title "$title" --label freshness --body-file gaps.md; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Nothing left to act on as of this week's refresh."
          fi
          rm -f gaps.md
      # The merge below is unattended, so the tree the pull request carries must pass what a person's branch passes.
      # The gates never fail the job: when one does the pull request is still opened, the merge step is skipped and
      # the next step labels it for review, so a red snapshot waits for a person instead of landing on main.
      - id: gates
        uses: ./.github/actions/gates
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-universe
          title: "Weekly refresh: universe denominators and lists"
          commit-message: "chore: refresh universe lists (NCI drugs and types, NCI centres, OECI, NHS alliances, NLM journals, OpenAlex, KEGG, ChEMBL, ClinicalTrials.gov, FDA OCE)"
          body: |
            Automated weekly pull of the external lists and counts that `/completeness/` compares the corpus against, into `src/data/universe-lists/*.json`:
            NCI A to Z cancer drugs and cancer types, GLOBOCAN sites, NCI-designated centres, OECI members, NHS England Cancer Alliances, UICC member count, MEDLINE oncology journals, the 100 most-cited oncology works, KEGG and Reactome cancer pathways, the NCI dictionary term count, ClinicalTrials.gov counts and industry sponsors, FDA OCE sponsors, and ChEMBL oncology targets.
            A source that could not be reached keeps its previous snapshot. Check the diff for denominators that moved, then look at `/completeness/` for newly listed items to add.
          labels: automated, pipeline
          delete-branch: true
      - name: Merge it (only when this run's gates passed)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
      - name: Leave it for review (a gate failed in this run)
        if: steps.cpr.outputs.pull-request-number != '' && steps.gates.outputs.passed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create needs-review --color D93F0B --description "A person must check this before it lands" --force || true
          gh pr edit "${{ steps.cpr.outputs.pull-request-number }}" --add-label needs-review
          gh pr comment "${{ steps.cpr.outputs.pull-request-number }}" --body "Not merged: ${{ steps.gates.outputs.failed }} failed in [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). The snapshot is on this branch for a person to read."
